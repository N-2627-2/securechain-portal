version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: securechain_db
    environment:
      POSTGRES_USER: securechain_admin
      POSTGRES_PASSWORD: securechain_secret
      POSTGRES_DB: securechain_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securechain_admin -d securechain_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securechain_backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: securechain_admin
      POSTGRES_PASSWORD: securechain_secret
      POSTGRES_DB: securechain_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securechain_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data: